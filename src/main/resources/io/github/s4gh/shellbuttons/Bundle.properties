OpenIDE-Module-Display-Category=Tools
OpenIDE-Module-Name=Icon-Only Minimized Windows
OpenIDE-Module-Short-Description=Shows minimized windows on the left and right edges as icons only
OpenIDE-Module-Long-Description=\
    Changes the buttons of minimized windows on the left and right edges of the main window \
    so that only their icons are displayed (the window name is still available as a tooltip). \
    The width of the icon area can be set in Tools > Options > Appearance > Minimized Windows.

